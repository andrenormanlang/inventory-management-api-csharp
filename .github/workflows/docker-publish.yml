name: Build and push Docker image

on:
  push:
    branches: [ 'master', 'main' ]

permissions:
  contents: read

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Log in to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v4
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/inventory-api:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/inventory-api:${{ github.sha }}
          cache-from: type=registry,ref=${{ secrets.DOCKERHUB_USERNAME }}/inventory-api:cache
          cache-to: type=registry,ref=${{ secrets.DOCKERHUB_USERNAME }}/inventory-api:cache,mode=max

      - name: Show pushed image tags
        run: |
          echo "Pushed:${{ secrets.DOCKERHUB_USERNAME }}/inventory-api:latest"
          echo "Pushed:${{ secrets.DOCKERHUB_USERNAME }}/inventory-api:${{ github.sha }}"
